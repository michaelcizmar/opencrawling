version: '3.5'

services:
  vespa:
    container_name: vespa-standalone
    image: vespaengine/vespa:8
    ports:
      - "8080:8080"
      - "19071:19071"
    volumes:
      - vespa_data:/opt/vespa/var
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19071/ApplicationStatus || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: deploys vespa-app/ (schema + services.xml) via the config server's deploy REST API,
  # then exits. The connector itself only feeds documents, it does not manage schema.
  vespa-deploy:
    container_name: vespa-schema-deploy
    image: alpine:3.20
    volumes:
      - ../vespa-app:/vespa-app:ro
    depends_on:
      vespa:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache curl >/dev/null &&
        cd /vespa-app &&
        tar czf - . | curl -sf --header "Content-Type:application/x-gzip" --data-binary @-
        http://vespa:19071/application/v2/tenant/default/prepareandactivate

volumes:
  vespa_data:
